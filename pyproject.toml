[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cllm"
version = "0.1.0"
description = "Python frontend for the nano-vllm.cpp inference engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyzmq",
    "msgpack",
    "fastapi",
    "uvicorn",
    "transformers",
    "huggingface_hub",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.setuptools.packages.find]
include = ["cllm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = ["gpu: requires the compiled extension and a local model on an NVIDIA GPU"]
